name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Download pinned official build dependencies
        shell: powershell
        run: ./tools/Prepare-Build.ps1
      - name: Build Windows installer and portable application
        run: node tools/package.mjs --skip-ebs
      - name: Desktop lifecycle
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node tests/desktop-lifecycle.mjs "dist/SPAM-Twitch-Companion-$version/SpamCardInspector.exe"
      - name: Installer and update helper lifecycle
        shell: powershell
        run: ./tests/windows-installer.ps1
      - name: Sign update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPAM_UPDATE_PRIVATE_KEY: ${{ secrets.SPAM_UPDATE_PRIVATE_KEY }}
        run: node tools/release.mjs
      - name: Attest GitHub build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/SPAM-Twitch-Setup-*.exe
            dist/SPAM-Twitch-Setup.exe
            dist/SPAM-Twitch-Companion-*.zip
            dist/update.json
      - name: Store build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spam-twitch-windows
          path: |
            dist/SPAM-Twitch-Setup-*.exe
            dist/SPAM-Twitch-Setup.exe
            dist/SPAM-Twitch-Companion-*.zip
            dist/update.json*
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" "dist/SPAM-Twitch-Setup-$version.exe" dist/SPAM-Twitch-Setup.exe "dist/SPAM-Twitch-Companion-$version.zip" dist/update.json dist/update.json.sig dist/SHA256SUMS.txt --verify-tag --title "SPAM Card Inspector $version" --notes-file docs/RELEASE-NOTES.md
